name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 單元測試(純邏輯模組)
      - run: npm test
      # WCAG AA 對比度(從 src/index.css 解析 token,未達標即失敗)
      - run: npm run test:contrast
      # 建置
      - run: npm run build
      # E2E smoke 跑在 preview server
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
