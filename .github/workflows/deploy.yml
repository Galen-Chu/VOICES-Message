name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deploy-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # V0 尚無任何 VITE_ 環境注入;日後上線平台/AI 設定時,依家族 proven 模式加:
      # env: + shell if(secrets 不可用於 step 的 if:)——見媒管庫 docs/INCIDENTS.md
      - run: npm test
      # WCAG AA 對比度(從 src/index.css 解析 token,未達標即失敗)
      - run: npm run test:contrast
      - run: npm run test:typography
      # build 內含 tsc -b 型別檢查
      - run: npm run build
      # E2E smoke 跑在 preview server;通過才部署(部署閘門)
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      # enablement: 新 repo 的 Pages 預設未啟用——此參數自動開啟(首跑失敗教訓,2026-10-14)
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      # 2026-11-25 教訓(家族共用):GitHub 服務端「抓 artifact metadata 的 API 讀取」
      # 會間歇瞬斷(deploy-pages 回「No artifacts named github-pages found」,但 artifact
      # 實際存在未過期、上游步驟全綠)。首次嘗試失敗時等 30 秒重試一次;重試步驟刻意
      # 不加 continue-on-error——兩次都敗時 run 仍為紅燈,不造假綠燈。與文管庫 TEXT 同款。
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before deploy retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Deploy retry
        id: deploy-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
